<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 主板图案 -->
  <rect x="80" y="128" width="352" height="256" rx="16" fill="#0f3460" stroke="#58a6ff" stroke-width="3"/>
  <!-- PCB 纹理线 -->
  <line x1="256" y1="144" x2="256" y2="368" stroke="#1a4a7a" stroke-width="2"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="#1a4a7a" stroke-width="2"/>
  <!-- 芯片 -->
  <rect x="216" y="216" width="80" height="80" rx="8" fill="#e94560" stroke="#fff" stroke-width="2"/>
  <rect x="224" y="224" width="64" height="64" rx="4" fill="#fff" opacity="0.1"/>
  <!-- 芯片引脚 -->
  <g stroke="#58a6ff" stroke-width="2">
    <line x1="230" y1="216" x2="230" y2="200"/> <line x1="246" y1="216" x2="246" y2="200"/>
    <line x1="262" y1="216" x2="262" y2="200"/> <line x1="278" y1="216" x2="278" y2="200"/>
    <line x1="230" y1="296" x2="230" y2="312"/> <line x1="246" y1="296" x2="246" y2="312"/>
    <line x1="262" y1="296" x2="262" y2="312"/> <line x1="278" y1="296" x2="278" y2="312"/>
    <line x1="216" y1="230" x2="200" y2="230"/> <line x1="216" y1="246" x2="200" y2="246"/>
    <line x1="296" y1="230" x2="312" y2="230"/> <line x1="296" y1="246" x2="312" y2="246"/>
  </g>
  <!-- USB 接口 -->
  <rect x="100" y="336" width="60" height="16" rx="3" fill="#58a6ff"/>
  <rect x="100" y="144" width="60" height="16" rx="3" fill="#58a6ff"/>
  <!-- 信号波浪 -->
  <path d="M 176 180 Q 196 160 216 180 T 256 180 T 296 180 T 336 180" stroke="#3fb950" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 176 240 Q 196 220 216 240 T 256 240 T 296 240 T 336 240" stroke="#58a6ff" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 176 300 Q 196 280 216 300 T 256 300 T 296 300 T 336 300" stroke="#e94560" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- 按键 K/M 标识 -->
  <text x="140" y="268" font-family="sans-serif" font-size="14" fill="#3fb950" font-weight="bold">K</text>
  <text x="140" y="288" font-family="sans-serif" font-size="14" fill="#58a6ff" font-weight="bold">M</text>
  <!-- 文字 -->
  <text x="256" y="440" font-family="sans-serif" font-size="28" fill="#e6edf3" text-anchor="middle" font-weight="700" letter-spacing="4">OSRBOT</text>
</svg>
